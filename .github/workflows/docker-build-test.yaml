#This action test builds EMHASS Docker images, in each architecture.
name: "Test Building Docker Image"

on:
  push:
    branches: [master,testing]
  pull_request:
    branches: [master,testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          [
            { target_arch: amd64, buildx: "linux/amd64", os_version: debian },
            { target_arch: aarch64, buildx: "linux/arm64", os_version: debian },
          ]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform.buildx }}
          build-args: |
            TARGETARCH=${{ matrix.platform.target_arch }}
            os_version=${{ matrix.platform.os_version }}
          load: true
      - name: Test Image # Expect startup to reject the missing secrets file.
        env:
          EMHASS_IMAGE: ${{ steps.build.outputs.imageid }}
        run: |
          docker_status=0
          docker_output=$(docker run --rm "$EMHASS_IMAGE" 2>&1) || docker_status=$?
          printf '%s\n' "$docker_output"
          if [ "$docker_status" -eq 0 ] || [ "$docker_status" -ge 125 ] ||
             ! grep -Fq 'FileNotFoundError' <<< "$docker_output" ||
             ! grep -Fq 'secrets_emhass.yaml' <<< "$docker_output"; then
            echo 'Image did not fail with the expected missing secrets file error.'
            exit 1
          fi
      # Google OSV-Scanner
      # Extract Debian and Python packadge list stored in Image
      - name: Export Debian package list
        run: mkdir OSV && docker run --rm --entrypoint '/bin/cat' ${{ steps.build.outputs.imageid }} /var/lib/dpkg/status >> ./OSV/${{ matrix.platform.target_arch }}.status
      - name: Export Python package list
        run: docker run --rm --entrypoint '/bin/cat' ${{ steps.build.outputs.imageid }} uv.lock >> ./OSV/${{ matrix.platform.target_arch }}.lock
      - name: Upload package list as digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.platform.target_arch }}-packages
          path: ./OSV/*
          if-no-files-found: error
          retention-days: 1

  osv-scan:
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        platform:
          [
            { target_arch: amd64 },
            { target_arch: aarch64 }
          ]
    # Check Docker image debian and python packages list for known vulnerabilities
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6fc714450122bda9d00e4ad5d639ad6a39eedb1f" # v2.0.1
    with:
      download-artifact: "${{ matrix.platform.target_arch }}-packages"
      matrix-property: "${{ matrix.platform.target_arch }}-"
      fail-on-vuln: false
      scan-args: |-
        --lockfile=dpkg-status:./${{ matrix.platform.target_arch }}.status
        --lockfile=poetry.lock:./${{matrix.platform.target_arch }}.lock
    permissions:
      actions: read
      security-events: write
      contents: read
