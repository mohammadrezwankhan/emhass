name: CodeCov

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"

      - name: Generate Report
        run: |
          uv venv
          uv sync --reinstall --extra test
          uv run coverage run -m --source=emhass unittest
          uv run coverage report
          uv run coverage xml -o coverage.xml

      - name: Upload coverage reports to Codecov
        if: github.event.pull_request.head.repo.fork == false
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: SonarQube Scan
        if: github.event.pull_request.head.repo.fork == false
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=davidusb-geek
            -Dsonar.projectKey=davidusb-geek_emhass
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=./src
            -Dsonar.tests=./tests
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.scanner.skipJreProvisioning=true
