<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="h-emhass-title h-emhass-desc">
<title id="h-emhass-title">Home Energy Automation Lab — 2.5D teaching laboratory</title>
<desc id="h-emhass-desc">An isometric vector illustration of charging station. Decorative animation only; all dashboard telemetry is synthetic.</desc>
<defs>
      <linearGradient id="h-emhass-bg" x2="1" y2="1"><stop stop-color="#120D2B"/><stop offset="1" stop-color="#070C16"/></linearGradient>
      <linearGradient id="h-emhass-top" x2="0.8" y2="1"><stop stop-color="#B388FF" stop-opacity=".3"/><stop offset="1" stop-color="#120D2B"/></linearGradient>
      <radialGradient id="h-emhass-halo"><stop stop-color="#B388FF" stop-opacity=".16"/><stop offset="1" stop-color="#B388FF" stop-opacity="0"/></radialGradient>
      <pattern id="h-emhass-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#BDD8EB" opacity=".12"/></pattern>
      <clipPath id="h-emhass-clip"><rect width="960" height="560" rx="24"/></clipPath>
    </defs>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      .flow{animation:h-emhass-flow 2.4s linear infinite}
      .float{animation:h-emhass-float 5s ease-in-out infinite}
      .signal{animation:h-emhass-signal 2.6s ease-in-out infinite}
      @keyframes h-emhass-flow{to{stroke-dashoffset:-34}}
      @keyframes h-emhass-float{50%{transform:translateY(-6px)}}
      @keyframes h-emhass-signal{50%{opacity:.35}}
      @media(prefers-reduced-motion:reduce){.flow,.float,.signal{animation:none!important}}
    </style>
    <g clip-path="url(#h-emhass-clip)">
      <rect width="960" height="560" rx="24" fill="url(#h-emhass-bg)"/>
      <rect width="960" height="560" fill="url(#h-emhass-dots)"/>
      <ellipse cx="480" cy="326" rx="360" ry="225" fill="url(#h-emhass-halo)"/>
